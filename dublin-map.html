<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dublin Interactive Guide — Clio's Map</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }
        
        #map {
            flex: 1;
            z-index: 1;
        }
        
        .sidebar {
            width: 380px;
            background: white;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            padding: 24px;
        }
        
        .sidebar h1 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #333;
        }
        
        .sidebar .vibe {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
            font-style: italic;
        }
        
        .section {
            margin-bottom: 24px;
        }
        
        .section h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .section ul {
            list-style: none;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .section li {
            margin-bottom: 8px;
            color: #555;
        }
        
        .section strong {
            color: #333;
            display: block;
            margin-bottom: 2px;
        }
        
        .verdict {
            background: #f0f4ff;
            border-left: 3px solid #0066ff;
            padding: 12px;
            font-size: 13px;
            color: #333;
            margin-top: 16px;
            border-radius: 4px;
        }
        
        .verdict.good {
            background: #f0fff4;
            border-left-color: #00b341;
        }
        
        .verdict.skip {
            background: #fff0f0;
            border-left-color: #ff4444;
        }
        
        .distance {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        
        .emoji {
            margin-right: 6px;
        }
        
        .welcome {
            text-align: center;
            color: #888;
            padding: 40px 0;
        }
        
        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333;
        }
        
        .welcome p {
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* Map markers */
        .marker-icon {
            background: white;
            border: 2px solid #0066ff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        .marker-icon:hover {
            box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
            transform: scale(1.1);
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            #map {
                height: 50vh;
            }
            
            .sidebar {
                width: 100%;
                height: 50vh;
            }
        }
    </style>
</head>

        // Create district markers
        Object.keys(districts).forEach(key => {
            const district = districts[key];
            const marker = L.circleMarker([district.lat, district.lng], {
                radius: 20,
                fillColor: key === 'merchants-quay' ? '#ff6b6b' : '#0066ff',
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);
            
            marker.on('click', () => showDistrict(key));
        });
        
        // Create venue markers
        Object.keys(venues).forEach(key => {
            const venue = venues[key];
            const marker = L.circleMarker([venue.lat, venue.lng], {
                radius: 8,
                fillColor: venue.color,
                color: '#fff',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.7
            }).addTo(map);
            
            marker.on('click', () => showVenue(key));
        });
        
        function showDistrict(key) {
            const district = districts[key];
            let html = `
                <h1>${district.emoji} ${district.name}</h1>
                <div class="vibe">"${district.vibe}"</div>
                <div class="distance">📍 ${district.distance}</div>
            `;
            
            if (district.eat) {
                html += `
                    <div class="section">
                        <h3>🍽️ Eat</h3>
                        <ul>
                            ${district.eat.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (district.drink) {
                html += `
                    <div class="section">
                        <h3>🍺 Drink</h3>
                        <ul>
                            ${district.drink.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (district.club) {
                html += `
                    <div class="section">
                        <h3>🎵 Club</h3>
                        <ul>
                            ${district.club.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (district.do) {
                html += `
                    <div class="section">
                        <h3>✨ Do</h3>
                        <ul>
                            ${district.do.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            html += `<div class="verdict ${district.verdictClass}"><strong>Verdict:</strong> ${district.verdict}</div>`;
            
            document.getElementById('info').innerHTML = html;
        }
        
        function showVenue(key) {
            const venue = venues[key];
            let typeEmoji = '🍽️';
            if (venue.type === 'pub') typeEmoji = '🍺';
            if (venue.type === 'club') typeEmoji = '🎵';
            if (venue.type === 'cafe') typeEmoji = '☕';
            if (venue.type === 'event') typeEmoji = '🎉';
            if (venue.type === 'venue') typeEmoji = '🎭';
            if (venue.type === 'food-market') typeEmoji = '🍴';
            if (venue.type === 'bar') typeEmoji = '🍺';
            
            let html = `
                <h1>${typeEmoji} ${venue.name}</h1>
                <div class="vibe">"${venue.vibe}"</div>
                <div class="distance">📍 ${venue.district}</div>
            `;
            
            if (venue.cuisine) {
                html += `<div class="section"><h3>🍴 Cuisine</h3><p>${venue.cuisine}</p></div>`;
            }
            
            if (venue.music) {
                html += `<div class="section"><h3>🎵 Music</h3><p>${venue.music}</p></div>`;
            }
            
            html += `<div class="section"><h3>📝 Note</h3><p>${venue.note}</p></div>`;
            
            document.getElementById('info').innerHTML = html;
        }
